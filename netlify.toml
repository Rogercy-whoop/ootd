# How Netlify builds and serves OOTD. Settings here override the Netlify dashboard.
[build]
  command = "npm run build"
  # Next.js apps publish the .next folder; Netlify's Next.js runtime turns it into
  # static pages plus server functions (needed for the Gemini calls).
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
